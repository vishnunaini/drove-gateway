<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drove Gateway Metrics UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f766e;
      --warn: #b45309;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f8fafc 0%, #f3f4f6 100%);
    }

    header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }

    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .controls input,
    .controls select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      width: 90px;
      background: #fff;
      color: var(--ink);
    }

    .controls button {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      cursor: pointer;
    }

    .controls button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .controls button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .status .warn {
      color: var(--warn);
      font-weight: 600;
    }

    main {
      padding: 16px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      padding: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: border-color 120ms ease, box-shadow 120ms ease;
      cursor: pointer;
    }

    .card.selected {
      border-color: #0f766e;
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.14);
    }

    .card.span-2 {
      grid-column: span 2;
    }

    .card.span-full {
      grid-column: 1 / -1;
    }

    .grid.grid-focus {
      grid-template-columns: 1fr;
    }

    .grid.grid-focus .card {
      display: none;
    }

    .grid.grid-focus .card.panel-expanded {
      display: block;
      grid-column: 1 / -1;
      min-height: calc(100vh - 220px);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .metric-name {
      font-size: 14px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .metric-type {
      font-size: 11px;
      color: #0b6b6f;
      background: #ecfeff;
      border: 1px solid #a5f3fc;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .metric-help {
      margin: 0 0 8px 0;
      color: var(--muted);
      font-size: 12px;
      min-height: 16px;
    }

    .panel-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px 0;
    }

    .panel-tools .indicator-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .panel-tools .indicator-group span {
      font-weight: 600;
      min-width: 10px;
    }

    .panel-tools .indicator-group button {
      width: 20px;
      height: 20px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      cursor: pointer;
    }

    .panel-tools .indicator-group button:hover {
      background: #f8fafc;
    }

    .canvas-wrap {
      height: 180px;
      margin-bottom: 8px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      padding: 6px;
      background: #fff;
    }

    .small-note {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    details {
      border-top: 1px dashed var(--line);
      padding-top: 8px;
    }

    summary {
      cursor: pointer;
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }

    .series-table-wrap {
      max-height: 220px;
      overflow: auto;
      overscroll-behavior: contain;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid #f3f4f6;
      padding: 4px 3px;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .empty {
      border: 1px dashed var(--line);
      padding: 16px;
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card.span-2,
      .card.span-full {
        grid-column: span 1;
      }

      .canvas-wrap {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Drove Gateway Metrics UI</h1>
    <div class="sub">Client-side parser for Prometheus/OpenMetrics text from <code>/v1/metrics</code>. Native/sparse histograms are visualized through classic compatibility series.</div>
    <div class="controls">
      <label>
        Refresh (seconds)
        <input id="refreshSec" type="number" min="1" step="1" value="5">
      </label>
      <label>
        Chart points
        <input id="historyPoints" type="number" min="20" step="10" value="120">
      </label>
      <label>
        Filter
        <input id="filterText" type="text" value="" placeholder="metric name">
      </label>
      <label>
        Bucket (le)
        <select id="bucketSelector">
          <option value="__all__">All</option>
        </select>
      </label>
      <button id="applyBtn" class="primary">Apply</button>
      <button id="pauseBtn">Pause</button>
      <button id="refreshBtn">Refresh now</button>
      <button id="expandSelectedBtn">Expand selected</button>
    </div>
    <div class="status">
      <span id="statusText">Waiting for first fetch...</span>
      <span id="lastUpdated"></span>
      <span id="formatText"></span>
      <span id="counts"></span>
      <span id="selectedPanelText">No panel selected</span>
    </div>
  </header>

  <main>
    <div id="metricsGrid" class="grid"></div>
  </main>

  <script>
    (function () {
      'use strict';

      var METRICS_PATH = '/v1/metrics';
      var refreshInput = document.getElementById('refreshSec');
      var historyInput = document.getElementById('historyPoints');
      var filterInput = document.getElementById('filterText');
      var bucketSelector = document.getElementById('bucketSelector');
      var applyBtn = document.getElementById('applyBtn');
      var pauseBtn = document.getElementById('pauseBtn');
      var refreshBtn = document.getElementById('refreshBtn');
      var expandSelectedBtn = document.getElementById('expandSelectedBtn');
      var statusText = document.getElementById('statusText');
      var lastUpdated = document.getElementById('lastUpdated');
      var formatText = document.getElementById('formatText');
      var counts = document.getElementById('counts');
      var selectedPanelText = document.getElementById('selectedPanelText');
      var grid = document.getElementById('metricsGrid');

      var chartPalette = [
        '#0f766e', '#0369a1', '#7c3aed', '#b45309', '#b91c1c',
        '#334155', '#be123c', '#15803d', '#1d4ed8', '#7e22ce',
        '#ea580c', '#475569', '#166534', '#831843', '#0e7490'
      ];

      var familyCharts = new Map();
      var seriesHistory = new Map();
      var isPaused = false;
      var fetchInFlight = false;
      var pollTimer = null;
      var chartSeriesLimit = 16;
      var functionDurationFamilyName = 'drove_gateway_function_duration_seconds';
      var functionLabelKey = 'function';
      var bucketLabelKey = 'le';
      var bucketFilterAllValue = '__all__';
      var histogramSuffixBucket = '_bucket';
      var histogramSuffixCount = '_count';
      var histogramSuffixSum = '_sum';
      var histogramSuffixCreated = '_created';
      var histogramSuffixGaugeCount = '_gcount';
      var histogramSuffixGaugeSum = '_gsum';
      var latestFamilies = [];
      var panelLayoutState = new Map();
      var selectedPanelKey = '';
      var expandedPanelKey = '';
      var panelHeightStepPx = 40;
      var panelMinHeightPx = 140;
      var panelMaxHeightPx = 920;
      var panelSpanOrder = ['1', '2', 'full'];
      var panelTitleByKey = new Map();
      var panelSeriesDetailsOpenState = new Map();
      var panelSeriesTableScrollState = new Map();
      var metricsAcceptHeader = 'application/openmetrics-text; version=1.0.0; charset=utf-8, text/plain; version=0.0.4; q=0.9, */*; q=0.1';
      var latestRenderToken = 0;

      function schedulePolling() {
        if (pollTimer !== null) {
          window.clearInterval(pollTimer);
          pollTimer = null;
        }
        if (isPaused) {
          return;
        }
        var intervalSec = parsePositiveInt(refreshInput.value, 5);
        pollTimer = window.setInterval(fetchAndRender, intervalSec * 1000);
      }

      function parsePositiveInt(value, fallback) {
        var n = Number(value);
        if (!Number.isFinite(n) || n <= 0) {
          return fallback;
        }
        return Math.floor(n);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getWindowScrollOffset() {
        var x = 0;
        var y = 0;
        if (typeof window.pageXOffset === 'number') {
          x = window.pageXOffset;
        } else if (document.documentElement && typeof document.documentElement.scrollLeft === 'number') {
          x = document.documentElement.scrollLeft;
        }
        if (typeof window.pageYOffset === 'number') {
          y = window.pageYOffset;
        } else if (document.documentElement && typeof document.documentElement.scrollTop === 'number') {
          y = document.documentElement.scrollTop;
        }
        return {
          x: x,
          y: y
        };
      }

      function restoreWindowScrollOffset(offset, renderToken) {
        window.requestAnimationFrame(function () {
          if (renderToken !== latestRenderToken) {
            return;
          }
          var x = Math.max(0, Number(offset && offset.x) || 0);
          var y = Math.max(0, Number(offset && offset.y) || 0);
          window.scrollTo(x, y);
        });
      }

      function capturePanelSeriesTableScrollState() {
        var wrappers = grid.querySelectorAll('.series-table-wrap[data-panel-scroll-key]');
        for (var i = 0; i < wrappers.length; i++) {
          var wrapper = wrappers[i];
          var key = wrapper.getAttribute('data-panel-scroll-key');
          if (!key) {
            continue;
          }
          panelSeriesTableScrollState.set(key, {
            top: wrapper.scrollTop,
            left: wrapper.scrollLeft
          });
        }
      }

      function getPanelLayout(panelKey) {
        var layout = panelLayoutState.get(panelKey);
        if (!layout) {
          layout = {
            heightPx: 180,
            span: '1'
          };
          panelLayoutState.set(panelKey, layout);
        }
        return layout;
      }

      function adjustPanelHeight(panelKey, deltaPx) {
        var layout = getPanelLayout(panelKey);
        layout.heightPx = clamp(layout.heightPx + deltaPx, panelMinHeightPx, panelMaxHeightPx);
      }

      function adjustPanelSpan(panelKey, step) {
        var layout = getPanelLayout(panelKey);
        var currentIndex = panelSpanOrder.indexOf(layout.span);
        if (currentIndex === -1) {
          currentIndex = 0;
        }
        var nextIndex = clamp(currentIndex + step, 0, panelSpanOrder.length - 1);
        layout.span = panelSpanOrder[nextIndex];
      }

      function getPanelDisplayName(panelKey) {
        return panelTitleByKey.get(panelKey) || panelKey;
      }

      function updateExpandSelectedButton() {
        if (!expandSelectedBtn) {
          return;
        }
        if (expandedPanelKey) {
          expandSelectedBtn.textContent = 'Collapse expanded';
          expandSelectedBtn.disabled = false;
          return;
        }
        expandSelectedBtn.textContent = 'Expand selected';
        expandSelectedBtn.disabled = !selectedPanelKey;
      }

      function updateSelectedPanelStatusText() {
        if (!selectedPanelText) {
          return;
        }
        if (expandedPanelKey) {
          selectedPanelText.textContent = 'Expanded panel: ' + getPanelDisplayName(expandedPanelKey);
          return;
        }
        if (selectedPanelKey) {
          selectedPanelText.textContent = 'Selected panel: ' + getPanelDisplayName(selectedPanelKey);
          return;
        }
        selectedPanelText.textContent = 'No panel selected';
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function parseLabels(raw) {
        if (!raw || raw.length < 2) {
          return {};
        }

        var labels = {};
        var i = 1;
        var max = raw.length - 1;

        while (i < max) {
          while (i < max && (raw[i] === ' ' || raw[i] === ',')) {
            i++;
          }
          if (i >= max) {
            break;
          }

          var keyStart = i;
          while (i < max && raw[i] !== '=') {
            i++;
          }
          if (i >= max) {
            break;
          }

          var key = raw.slice(keyStart, i).trim();
          i++;
          if (raw[i] !== '"') {
            break;
          }
          i++;

          var value = '';
          while (i < max) {
            var ch = raw[i];
            if (ch === '\\') {
              i++;
              if (i >= max) {
                break;
              }
              var esc = raw[i];
              if (esc === 'n') {
                value += '\n';
              } else if (esc === 't') {
                value += '\t';
              } else {
                value += esc;
              }
              i++;
              continue;
            }
            if (ch === '"') {
              i++;
              break;
            }
            value += ch;
            i++;
          }

          if (key) {
            labels[key] = value;
          }

          while (i < max && raw[i] !== ',') {
            i++;
          }
          if (raw[i] === ',') {
            i++;
          }
        }

        return labels;
      }

      function labelsToString(labels) {
        var keys = Object.keys(labels).sort();
        if (keys.length === 0) {
          return '';
        }
        var parts = [];
        for (var i = 0; i < keys.length; i++) {
          var key = keys[i];
          parts.push(key + '="' + labels[key] + '"');
        }
        return '{' + parts.join(',') + '}';
      }

      function buildSeriesKey(metricName, labels) {
        return metricName + labelsToString(labels);
      }

      function buildSeriesLabel(metricName, labels) {
        var labelsText = labelsToString(labels);
        if (!labelsText) {
          return metricName;
        }
        return metricName + labelsText;
      }

      function inferFamily(metricName, familiesMap) {
        if (familiesMap.has(metricName)) {
          return metricName;
        }
        var suffixes = [
          histogramSuffixBucket,
          histogramSuffixSum,
          histogramSuffixCount,
          histogramSuffixCreated,
          histogramSuffixGaugeSum,
          histogramSuffixGaugeCount
        ];
        for (var i = 0; i < suffixes.length; i++) {
          var suffix = suffixes[i];
          if (metricName.endsWith(suffix)) {
            var base = metricName.slice(0, -suffix.length);
            if (familiesMap.has(base)) {
              return base;
            }
          }
        }
        return metricName;
      }

      function isTextMetricsContentType(contentType) {
        var lower = String(contentType || '').toLowerCase();
        return lower.indexOf('text/plain') !== -1 || lower.indexOf('application/openmetrics-text') !== -1;
      }

      function isProtobufMetricsContentType(contentType) {
        var lower = String(contentType || '').toLowerCase();
        return lower.indexOf('application/vnd.google.protobuf') !== -1 || lower.indexOf('application/openmetrics-protobuf') !== -1;
      }

      function countHistogramFamiliesWithoutBuckets(families) {
        var count = 0;
        for (var i = 0; i < families.length; i++) {
          var family = families[i];
          if (!isHistogramFamily(family)) {
            continue;
          }
          var hasClassicBucketSeries = false;
          for (var j = 0; j < family.samples.length; j++) {
            var sample = family.samples[j];
            if (isBucketSample(sample)) {
              hasClassicBucketSeries = true;
              break;
            }
          }
          if (!hasClassicBucketSeries) {
            count++;
          }
        }
        return count;
      }

      function updateFormatStatus(contentType, families) {
        if (!formatText) {
          return;
        }
        var baseType = String(contentType || '').split(';')[0] || 'unknown';
        var hints = ['Format: ' + baseType];

        if (isTextMetricsContentType(contentType)) {
          hints.push('Native/sparse histograms are shown via classic _bucket compatibility series.');
        }

        var histogramWithoutBuckets = countHistogramFamiliesWithoutBuckets(families);
        if (histogramWithoutBuckets > 0) {
          hints.push(
            'Detected ' + histogramWithoutBuckets + ' histogram family without classic buckets; native-only protobuf histograms cannot be expanded in this page.'
          );
        }

        formatText.textContent = hints.join(' | ');
      }

      function parsePrometheusText(text) {
        var lines = text.split(/\r?\n/);
        var familiesMap = new Map();

        function ensureFamily(name) {
          if (!familiesMap.has(name)) {
            familiesMap.set(name, {
              name: name,
              type: 'untyped',
              help: '',
              samples: []
            });
          }
          return familiesMap.get(name);
        }

        var numberPattern = '(?:[+-]?(?:\\d+\\.?\\d*|\\.\\d+)(?:[eE][+-]?\\d+)?|NaN|\\+Inf|-Inf)';
        var metricLinePattern = new RegExp('^([a-zA-Z_:][a-zA-Z0-9_:]*)(\\{[^}]*\\})?\\s+(' + numberPattern + ')(?:\\s+' + numberPattern + ')?$', 'i');

        for (var i = 0; i < lines.length; i++) {
          var rawLine = lines[i];
          var line = rawLine.trim();
          if (!line) {
            continue;
          }

          if (line.startsWith('# HELP ')) {
            var helpLine = line.slice(7);
            var firstSpace = helpLine.indexOf(' ');
            if (firstSpace > 0) {
              var metricName = helpLine.slice(0, firstSpace);
              var helpText = helpLine.slice(firstSpace + 1);
              var helpFamily = ensureFamily(metricName);
              helpFamily.help = helpText;
            }
            continue;
          }

          if (line.startsWith('# TYPE ')) {
            var typeParts = line.slice(7).split(/\s+/);
            if (typeParts.length >= 2) {
              var typeFamily = ensureFamily(typeParts[0]);
              typeFamily.type = typeParts[1];
            }
            continue;
          }

          if (line.startsWith('#')) {
            continue;
          }

          // OpenMetrics can append exemplar payloads as: "# {...} <ts>".
          // Strip that tail so classic sample parsing remains compatible.
          var sampleLine = line;
          var exemplarDelimiter = sampleLine.indexOf(' # ');
          if (exemplarDelimiter !== -1) {
            sampleLine = sampleLine.slice(0, exemplarDelimiter).trim();
          }

          var match = sampleLine.match(metricLinePattern);
          if (!match) {
            continue;
          }

          var sampleName = match[1];
          var labelBlock = match[2] || '';
          var rawValue = match[3];
          var value = Number(rawValue);
          if (Number.isNaN(value)) {
            continue;
          }

          var labels = parseLabels(labelBlock);
          var familyName = inferFamily(sampleName, familiesMap);
          var sampleFamily = ensureFamily(familyName);
          sampleFamily.samples.push({
            metricName: sampleName,
            labels: labels,
            value: value
          });
        }

        var families = Array.from(familiesMap.values());
        families.sort(function (a, b) {
          return a.name.localeCompare(b.name);
        });

        for (var j = 0; j < families.length; j++) {
          families[j].samples.sort(function (a, b) {
            return compareSamplesForDisplay(a, b);
          });
        }

        return families;
      }

      function addHistoryPoint(seriesKey, point) {
        var maxPoints = parsePositiveInt(historyInput.value, 120);
        var points = seriesHistory.get(seriesKey);
        if (!points) {
          points = [];
        }
        points.push(point);
        if (points.length > maxPoints) {
          points.splice(0, points.length - maxPoints);
        }
        seriesHistory.set(seriesKey, points);
      }

      function updateHistory(families) {
        var now = Date.now();
        for (var i = 0; i < families.length; i++) {
          var family = families[i];
          for (var j = 0; j < family.samples.length; j++) {
            var sample = family.samples[j];
            var key = buildSeriesKey(sample.metricName, sample.labels);
            addHistoryPoint(key, { x: now, y: sample.value });
          }
        }
      }

      function formatValue(n) {
        if (!Number.isFinite(n)) {
          return String(n);
        }
        var abs = Math.abs(n);
        if (abs === 0) {
          return '0';
        }
        if (abs >= 1000 || abs < 0.001) {
          return n.toExponential(3);
        }
        return n.toFixed(4);
      }

      function timestampLabel(epochMs) {
        var d = new Date(Number(epochMs));
        return d.toLocaleTimeString();
      }

      function clearCharts() {
        for (var chart of familyCharts.values()) {
          chart.destroy();
        }
        familyCharts.clear();
      }

      function createDataset(seriesLabel, seriesKey, index) {
        return createDatasetFromPoints(seriesLabel, seriesHistory.get(seriesKey) || [], index);
      }

      function createDatasetFromPoints(seriesLabel, points, index) {
        return {
          label: seriesLabel,
          data: points,
          borderColor: chartPalette[index % chartPalette.length],
          backgroundColor: chartPalette[index % chartPalette.length],
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.2,
          parsing: false
        };
      }

      function counterDelta(currentValue, previousValue) {
        if (currentValue >= previousValue) {
          return currentValue - previousValue;
        }
        return currentValue;
      }

      function buildCounterDeltaPoints(seriesKey) {
        var history = seriesHistory.get(seriesKey) || [];
        var points = [];
        for (var i = 1; i < history.length; i++) {
          points.push({
            x: history[i].x,
            y: counterDelta(history[i].y, history[i - 1].y)
          });
        }
        return points;
      }

      function buildHistogramAverageDatasets(samples) {
        var componentsByLabels = new Map();

        for (var i = 0; i < samples.length; i++) {
          var sample = samples[i];
          var component = '';
          if (sample.metricName.endsWith(histogramSuffixSum)) {
            component = 'sum';
          } else if (sample.metricName.endsWith(histogramSuffixCount)) {
            component = 'count';
          } else {
            continue;
          }

          var labelsKey = labelsToString(sample.labels);
          if (!componentsByLabels.has(labelsKey)) {
            componentsByLabels.set(labelsKey, {
              labels: sample.labels,
              sumKey: '',
              countKey: ''
            });
          }
          componentsByLabels.get(labelsKey)[component + 'Key'] = buildSeriesKey(sample.metricName, sample.labels);
        }

        var datasets = [];
        for (var components of componentsByLabels.values()) {
          if (datasets.length >= chartSeriesLimit) {
            break;
          }
          if (!components.sumKey || !components.countKey) {
            continue;
          }

          var sumHistory = seriesHistory.get(components.sumKey) || [];
          var countHistory = seriesHistory.get(components.countKey) || [];
          var pointCount = Math.min(sumHistory.length, countHistory.length);
          var averagePoints = [];

          for (var pointIndex = 1; pointIndex < pointCount; pointIndex++) {
            var histogramReset = countHistory[pointIndex].y < countHistory[pointIndex - 1].y;
            var countDelta = histogramReset
              ? countHistory[pointIndex].y
              : countHistory[pointIndex].y - countHistory[pointIndex - 1].y;
            if (countDelta <= 0) {
              continue;
            }
            var sumDelta = histogramReset
              ? sumHistory[pointIndex].y
              : sumHistory[pointIndex].y - sumHistory[pointIndex - 1].y;
            if (sumDelta < 0) {
              continue;
            }
            averagePoints.push({
              x: countHistory[pointIndex].x,
              y: sumDelta / countDelta
            });
          }

          datasets.push(
            createDatasetFromPoints(
              'Average duration ' + (labelsKey || '{}'),
              averagePoints,
              datasets.length
            )
          );
        }
        return datasets;
      }

      function buildHistogramBucketDeltaDatasets(samples) {
        var datasets = [];
        for (var i = 0; i < samples.length && datasets.length < chartSeriesLimit; i++) {
          var sample = samples[i];
          if (!isBucketSample(sample)) {
            continue;
          }
          var seriesKey = buildSeriesKey(sample.metricName, sample.labels);
          datasets.push(
            createDatasetFromPoints(
              'Observations le=' + sample.labels[bucketLabelKey] + ' ' + labelsToStringExcluding(sample.labels, [bucketLabelKey]),
              buildCounterDeltaPoints(seriesKey),
              datasets.length
            )
          );
        }
        return datasets;
      }

      function buildPanelDefinition(family, title, panelKey, samples, splitFieldLabel) {
        return {
          key: panelKey,
          title: title,
          type: family.type || 'untyped',
          help: family.help || '',
          samples: samples,
          splitFieldLabel: splitFieldLabel || ''
        };
      }

      function splitFamilyIntoPanels(family) {
        if (family.name !== functionDurationFamilyName) {
          if (!isHistogramFamily(family)) {
            return [buildPanelDefinition(family, family.name, family.name, family.samples, '')];
          }

          return splitHistogramFamilyIntoPanels(family);
        }

        var groupedByFunction = new Map();
        for (var i = 0; i < family.samples.length; i++) {
          var sample = family.samples[i];
          var functionName = sample.labels[functionLabelKey] || 'unknown';
          if (!groupedByFunction.has(functionName)) {
            groupedByFunction.set(functionName, []);
          }
          groupedByFunction.get(functionName).push(sample);
        }

        var functionNames = Array.from(groupedByFunction.keys()).sort();
        if (functionNames.length === 0) {
          return [buildPanelDefinition(family, family.name, family.name, family.samples, '')];
        }

        var panels = [];
        for (var j = 0; j < functionNames.length; j++) {
          var functionName = functionNames[j];
          var splitFieldLabel = 'function=' + functionName;
          panels.push(
            buildPanelDefinition(
              family,
              family.name + ' [' + splitFieldLabel + ']',
              family.name + '|' + splitFieldLabel,
              groupedByFunction.get(functionName),
              splitFieldLabel
            )
          );
        }
        return panels;
      }

      function endsWithAny(value, suffixes) {
        for (var i = 0; i < suffixes.length; i++) {
          if (value.endsWith(suffixes[i])) {
            return true;
          }
        }
        return false;
      }

      function isHistogramFamily(family) {
        if ((family.type || '').toLowerCase() === 'histogram') {
          return true;
        }
        for (var i = 0; i < family.samples.length; i++) {
          var sample = family.samples[i];
          if (sample.metricName.endsWith(histogramSuffixBucket) && Object.prototype.hasOwnProperty.call(sample.labels, bucketLabelKey)) {
            return true;
          }
        }
        return false;
      }

      function labelsToStringExcluding(labels, excludedKeys) {
        var excluded = new Set(excludedKeys || []);
        var keys = Object.keys(labels).filter(function (key) {
          return !excluded.has(key);
        }).sort();
        if (keys.length === 0) {
          return '';
        }
        var parts = [];
        for (var i = 0; i < keys.length; i++) {
          var key = keys[i];
          parts.push(key + '="' + labels[key] + '"');
        }
        return '{' + parts.join(',') + '}';
      }

      function histogramPanelLabelsForSample(sample) {
        if (isBucketSample(sample)) {
          return labelsToStringExcluding(sample.labels, [bucketLabelKey]);
        }
        return labelsToString(sample.labels);
      }

      function splitHistogramFamilyIntoPanels(family) {
        var groups = new Map();
        for (var i = 0; i < family.samples.length; i++) {
          var sample = family.samples[i];
          var labelGroup = histogramPanelLabelsForSample(sample);
          if (!groups.has(labelGroup)) {
            groups.set(labelGroup, []);
          }
          groups.get(labelGroup).push(sample);
        }

        if (groups.size === 0) {
          return [buildPanelDefinition(family, family.name, family.name, family.samples, '')];
        }

        var labelGroups = Array.from(groups.keys()).sort();
        var panels = [];
        for (var j = 0; j < labelGroups.length; j++) {
          var labelGroup = labelGroups[j];
          var splitFieldLabel = labelGroup ? labelGroup.slice(1, -1) : '';
          var titleSuffix = labelGroup ? ' [' + splitFieldLabel + ']' : '';
          panels.push(
            buildPanelDefinition(
              family,
              family.name + titleSuffix,
              family.name + '|' + (splitFieldLabel || 'all'),
              groups.get(labelGroup),
              splitFieldLabel
            )
          );
        }
        return panels;
      }

      function sampleSortWeight(metricName) {
        if (metricName.endsWith(histogramSuffixBucket)) {
          return 0;
        }
        if (endsWithAny(metricName, [histogramSuffixCount, histogramSuffixGaugeCount])) {
          return 1;
        }
        if (endsWithAny(metricName, [histogramSuffixSum, histogramSuffixGaugeSum])) {
          return 2;
        }
        if (metricName.endsWith(histogramSuffixCreated)) {
          return 3;
        }
        return 4;
      }

      function compareSamplesForDisplay(left, right) {
        var leftWeight = sampleSortWeight(left.metricName);
        var rightWeight = sampleSortWeight(right.metricName);
        if (leftWeight !== rightWeight) {
          return leftWeight - rightWeight;
        }

        if (isBucketSample(left) && isBucketSample(right)) {
          var leftGroup = labelsToStringExcluding(left.labels, [bucketLabelKey]);
          var rightGroup = labelsToStringExcluding(right.labels, [bucketLabelKey]);
          if (leftGroup !== rightGroup) {
            return leftGroup.localeCompare(rightGroup);
          }

          var leCmp = compareBucketValues(left.labels[bucketLabelKey], right.labels[bucketLabelKey]);
          if (!Number.isNaN(leCmp) && leCmp !== 0) {
            return leCmp;
          }
        }

        if (left.metricName !== right.metricName) {
          return left.metricName.localeCompare(right.metricName);
        }
        return buildSeriesKey(left.metricName, left.labels).localeCompare(buildSeriesKey(right.metricName, right.labels));
      }

      function isBucketSample(sample) {
        if (!sample || !sample.metricName || !sample.labels) {
          return false;
        }
        return sample.metricName.endsWith(histogramSuffixBucket) && Object.prototype.hasOwnProperty.call(sample.labels, bucketLabelKey);
      }

      function parseBucketValue(rawValue) {
        if (rawValue === '+Inf' || rawValue === 'Inf' || rawValue === 'inf') {
          return Number.POSITIVE_INFINITY;
        }
        var parsed = Number(rawValue);
        if (Number.isFinite(parsed)) {
          return parsed;
        }
        return null;
      }

      function compareBucketValues(left, right) {
        var leftNumber = parseBucketValue(left);
        var rightNumber = parseBucketValue(right);

        if (leftNumber !== null && rightNumber !== null) {
          if (!Number.isFinite(leftNumber) && !Number.isFinite(rightNumber)) {
            return 0;
          }
          return leftNumber - rightNumber;
        }
        if (leftNumber !== null) {
          return -1;
        }
        if (rightNumber !== null) {
          return 1;
        }
        return left.localeCompare(right);
      }

      function collectBucketValues(families) {
        var values = new Set();
        for (var i = 0; i < families.length; i++) {
          var family = families[i];
          for (var j = 0; j < family.samples.length; j++) {
            var sample = family.samples[j];
            if (isBucketSample(sample)) {
              values.add(sample.labels[bucketLabelKey]);
            }
          }
        }
        return Array.from(values).sort(compareBucketValues);
      }

      function updateBucketSelectorOptions(families) {
        var previousValue = bucketSelector.value || bucketFilterAllValue;
        var bucketValues = collectBucketValues(families);

        bucketSelector.innerHTML = '';
        var allOption = document.createElement('option');
        allOption.value = bucketFilterAllValue;
        allOption.textContent = 'All';
        bucketSelector.appendChild(allOption);

        for (var i = 0; i < bucketValues.length; i++) {
          var value = bucketValues[i];
          var option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          bucketSelector.appendChild(option);
        }

        if (previousValue === bucketFilterAllValue || bucketValues.indexOf(previousValue) !== -1) {
          bucketSelector.value = previousValue;
        } else {
          bucketSelector.value = bucketFilterAllValue;
        }

        bucketSelector.disabled = bucketValues.length === 0;
      }

      function filterSamplesByBucket(samples, selectedBucket) {
        if (selectedBucket === bucketFilterAllValue) {
          return samples;
        }

        var filtered = [];
        for (var i = 0; i < samples.length; i++) {
          var sample = samples[i];
          if (!isBucketSample(sample) || sample.labels[bucketLabelKey] === selectedBucket) {
            filtered.push(sample);
          }
        }
        return filtered;
      }

      function renderPanel(panel, selectedBucket) {
        var panelSamples = filterSamplesByBucket(panel.samples, selectedBucket);
        if (panelSamples.length === 0) {
          return 0;
        }

        var panelLayout = getPanelLayout(panel.key);
        var card = document.createElement('section');
        card.className = 'card';
        card.classList.add('span-' + panelLayout.span);
        if (selectedPanelKey === panel.key) {
          card.classList.add('selected');
        }
        if (expandedPanelKey === panel.key) {
          card.classList.add('panel-expanded');
        }

        var helpText = panel.help;
        if (panel.splitFieldLabel) {
          helpText = (helpText ? helpText + ' ' : '') + 'Split panel for ' + panel.splitFieldLabel + '.';
        }

        var detailsOpenAttr = panelSeriesDetailsOpenState.get(panel.key) ? ' open' : '';

        var titleHtml = '' +
          '<div class="title-row">' +
          '  <div class="metric-name">' + escapeHtml(panel.title) + '</div>' +
          '  <div class="metric-type">' + escapeHtml(panel.type) + '</div>' +
          '</div>' +
          '<p class="metric-help">' + escapeHtml(helpText) + '</p>' +
          '<div class="panel-tools">' +
          '  <div class="indicator-group" title="Panel width">' +
          '    <span>W</span>' +
          '    <button type="button" data-panel-action="span-dec" aria-label="Decrease panel width">&#8249;</button>' +
          '    <button type="button" data-panel-action="span-inc" aria-label="Increase panel width">&#8250;</button>' +
          '  </div>' +
          '  <div class="indicator-group" title="Chart height">' +
          '    <span>H</span>' +
          '    <button type="button" data-panel-action="height-dec" aria-label="Decrease chart height">&#9662;</button>' +
          '    <button type="button" data-panel-action="height-inc" aria-label="Increase chart height">&#9652;</button>' +
          '  </div>' +
          '</div>' +
          '<div class="canvas-wrap"><canvas></canvas></div>' +
          '<div class="small-note" data-note></div>' +
          '<details' + detailsOpenAttr + '>' +
          '  <summary>Series values (' + panelSamples.length + ')</summary>' +
          '  <div class="series-table-wrap" data-panel-scroll-key="' + escapeHtml(panel.key) + '">' +
          '  <table>' +
          '    <thead><tr><th>Series</th><th>Value</th></tr></thead>' +
          '    <tbody></tbody>' +
          '  </table>' +
          '  </div>' +
          '</details>';

        card.innerHTML = titleHtml;
        grid.appendChild(card);

        var detailsElement = card.querySelector('details');
        if (detailsElement) {
          detailsElement.addEventListener('toggle', function () {
            panelSeriesDetailsOpenState.set(panel.key, detailsElement.open);
          });
        }

        var seriesTableWrap = card.querySelector('.series-table-wrap');
        if (seriesTableWrap) {
          var savedTableScroll = panelSeriesTableScrollState.get(panel.key);
          if (savedTableScroll) {
            seriesTableWrap.scrollTop = Math.max(0, Number(savedTableScroll.top) || 0);
            seriesTableWrap.scrollLeft = Math.max(0, Number(savedTableScroll.left) || 0);
          }

          seriesTableWrap.addEventListener('scroll', function () {
            panelSeriesTableScrollState.set(panel.key, {
              top: seriesTableWrap.scrollTop,
              left: seriesTableWrap.scrollLeft
            });
          }, { passive: true });
        }

        card.addEventListener('click', function (event) {
          if (event.target && event.target.closest && event.target.closest('details')) {
            return;
          }
          if (event.target && event.target.closest && event.target.closest('.panel-tools')) {
            return;
          }
          if (selectedPanelKey === panel.key) {
            return;
          }
          selectedPanelKey = panel.key;
          updateSelectedPanelStatusText();
          updateExpandSelectedButton();
          renderFamilies(latestFamilies);
        });

        var panelToolButtons = card.querySelectorAll('[data-panel-action]');
        for (var toolIndex = 0; toolIndex < panelToolButtons.length; toolIndex++) {
          panelToolButtons[toolIndex].addEventListener('click', function (event) {
            event.stopPropagation();
            var action = event.currentTarget.getAttribute('data-panel-action');
            if (action === 'span-dec') {
              adjustPanelSpan(panel.key, -1);
            } else if (action === 'span-inc') {
              adjustPanelSpan(panel.key, 1);
            } else if (action === 'height-dec') {
              adjustPanelHeight(panel.key, -panelHeightStepPx);
            } else if (action === 'height-inc') {
              adjustPanelHeight(panel.key, panelHeightStepPx);
            }
            renderFamilies(latestFamilies);
          });
        }

        var canvasWrap = card.querySelector('.canvas-wrap');
        canvasWrap.style.height = String(panelLayout.heightPx) + 'px';
        if (expandedPanelKey === panel.key) {
          canvasWrap.style.height = '70vh';
        }

        var tbody = card.querySelector('tbody');
        for (var i = 0; i < panelSamples.length; i++) {
          var sample = panelSamples[i];
          var row = document.createElement('tr');
          var label = buildSeriesLabel(sample.metricName, sample.labels);
          row.innerHTML = '<td>' + escapeHtml(label) + '</td><td>' + escapeHtml(formatValue(sample.value)) + '</td>';
          tbody.appendChild(row);
        }

        var noteEl = card.querySelector('[data-note]');
        var bucketPrefix = selectedBucket === bucketFilterAllValue ? '' : 'Bucket filter le=' + selectedBucket + '. ';

        var datasets = [];
        var chartYAxisTitle = 'Value';
        var histogramPanel = panel.type.toLowerCase() === 'histogram';
        if (histogramPanel && selectedBucket === bucketFilterAllValue) {
          datasets = buildHistogramAverageDatasets(panelSamples);
          chartYAxisTitle = 'Duration (seconds)';
          noteEl.textContent = datasets.length === 0 || datasets[0].data.length === 0
            ? 'Waiting for two refreshes to calculate interval average duration.'
            : 'Chart shows interval average duration (delta sum / delta count). Raw cumulative histogram series remain in the table.';
        } else if (histogramPanel) {
          datasets = buildHistogramBucketDeltaDatasets(panelSamples);
          chartYAxisTitle = 'Observations per refresh';
          noteEl.textContent = bucketPrefix + 'Chart shows new cumulative-bucket observations during each refresh interval. Raw values remain in the table.';
        } else {
          var plotted = Math.min(panelSamples.length, chartSeriesLimit);
          for (var k = 0; k < plotted; k++) {
            var plottedSample = panelSamples[k];
            var seriesKey = buildSeriesKey(plottedSample.metricName, plottedSample.labels);
            var seriesLabel = buildSeriesLabel(plottedSample.metricName, plottedSample.labels);
            datasets.push(createDataset(seriesLabel, seriesKey, k));
          }

          if (panelSamples.length > plotted) {
            noteEl.textContent = 'Chart shows first ' + plotted + ' series (of ' + panelSamples.length + '). Expand table to view all series.';
          } else {
            noteEl.textContent = 'Chart shows all ' + panelSamples.length + ' series.';
          }
        }

        var canvas = card.querySelector('canvas');
        var chart = new Chart(canvas, {
          type: 'line',
          data: { datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  boxWidth: 10,
                  boxHeight: 10,
                  font: { size: 10 }
                }
              },
              tooltip: {
                callbacks: {
                  title: function (items) {
                    if (!items || items.length === 0) {
                      return '';
                    }
                    return timestampLabel(items[0].parsed.x);
                  }
                }
              }
            },
            scales: {
              x: {
                type: 'linear',
                ticks: {
                  callback: function (value) {
                    return timestampLabel(value);
                  },
                  maxTicksLimit: 5
                },
                grid: {
                  color: '#f1f5f9'
                }
              },
              y: {
                title: {
                  display: true,
                  text: chartYAxisTitle
                },
                grid: {
                  color: '#f1f5f9'
                }
              }
            }
          }
        });

        familyCharts.set(panel.key, chart);
        return panelSamples.length;
      }

      function renderFamilies(families) {
        var windowScrollOffsetBeforeRender = getWindowScrollOffset();
        capturePanelSeriesTableScrollState();
        latestRenderToken += 1;
        var renderToken = latestRenderToken;

        clearCharts();
        grid.innerHTML = '';

        var filter = filterInput.value.trim().toLowerCase();
        var selectedBucket = bucketSelector.value || bucketFilterAllValue;
        var shownPanels = 0;
        var shownSeries = 0;
        var renderedPanelKeys = new Set();
        var renderedPanelTitles = new Map();

        for (var i = 0; i < families.length; i++) {
          var family = families[i];
          var panels = splitFamilyIntoPanels(family);
          for (var j = 0; j < panels.length; j++) {
            var panel = panels[j];
            if (expandedPanelKey && expandedPanelKey !== panel.key) {
              continue;
            }
            var panelHaystack = (panel.title + ' ' + panel.help + ' ' + panel.splitFieldLabel).toLowerCase();
            if (filter && panelHaystack.indexOf(filter) === -1) {
              continue;
            }

            var renderedSeries = renderPanel(panel, selectedBucket);
            if (renderedSeries === 0) {
              continue;
            }

            shownPanels++;
            shownSeries += renderedSeries;
            renderedPanelKeys.add(panel.key);
            renderedPanelTitles.set(panel.key, panel.title);
          }
        }

        panelTitleByKey = renderedPanelTitles;
        if (selectedPanelKey && !renderedPanelKeys.has(selectedPanelKey)) {
          selectedPanelKey = '';
        }
        if (expandedPanelKey && !renderedPanelKeys.has(expandedPanelKey)) {
          expandedPanelKey = '';
        }

        if (expandedPanelKey) {
          grid.classList.add('grid-focus');
        } else {
          grid.classList.remove('grid-focus');
        }

        var bucketText = selectedBucket === bucketFilterAllValue ? 'all buckets' : ('bucket le=' + selectedBucket);
        counts.textContent = 'Showing ' + shownPanels + ' panels / ' + shownSeries + ' series (' + bucketText + ')';

        if (shownPanels === 0) {
          grid.innerHTML = '<div class="empty">No metrics matched the current filter.</div>';
        }

        updateSelectedPanelStatusText();
        updateExpandSelectedButton();
        restoreWindowScrollOffset(windowScrollOffsetBeforeRender, renderToken);
      }

      async function fetchAndRender() {
        if (fetchInFlight || isPaused) {
          return;
        }
        fetchInFlight = true;
        statusText.textContent = 'Fetching metrics...';
        statusText.classList.remove('warn');

        try {
          var response = await fetch(METRICS_PATH, {
            cache: 'no-store',
            headers: {
              'Accept': metricsAcceptHeader
            }
          });
          if (!response.ok) {
            throw new Error('HTTP ' + response.status + ' from ' + METRICS_PATH);
          }

          var contentType = response.headers.get('Content-Type') || '';
          if (isProtobufMetricsContentType(contentType)) {
            throw new Error(
              'received protobuf metrics (' + contentType + '); this browser page supports text exposition only'
            );
          }

          var body = await response.text();
          latestFamilies = parsePrometheusText(body);
          updateHistory(latestFamilies);
          updateBucketSelectorOptions(latestFamilies);
          renderFamilies(latestFamilies);
          updateFormatStatus(contentType, latestFamilies);

          statusText.textContent = 'OK';
          statusText.classList.remove('warn');
          lastUpdated.textContent = 'Last updated: ' + new Date().toLocaleString();
        } catch (error) {
          statusText.textContent = 'Failed to fetch metrics: ' + error.message;
          statusText.classList.add('warn');
          if (formatText) {
            formatText.textContent = '';
          }
        } finally {
          fetchInFlight = false;
        }
      }

      applyBtn.addEventListener('click', function () {
        schedulePolling();
        fetchAndRender();
      });

      pauseBtn.addEventListener('click', function () {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
        if (isPaused) {
          statusText.textContent = 'Paused';
          if (pollTimer !== null) {
            window.clearInterval(pollTimer);
            pollTimer = null;
          }
          return;
        }
        statusText.textContent = 'Resumed';
        schedulePolling();
        fetchAndRender();
      });

      refreshBtn.addEventListener('click', function () {
        fetchAndRender();
      });

      expandSelectedBtn.addEventListener('click', function () {
        if (expandedPanelKey) {
          expandedPanelKey = '';
          renderFamilies(latestFamilies);
          return;
        }

        if (!selectedPanelKey) {
          statusText.textContent = 'Select a panel first, then click Expand selected.';
          statusText.classList.add('warn');
          updateExpandSelectedButton();
          return;
        }

        expandedPanelKey = selectedPanelKey;
        statusText.classList.remove('warn');
        renderFamilies(latestFamilies);
      });

      bucketSelector.addEventListener('change', function () {
        renderFamilies(latestFamilies);
      });

      updateSelectedPanelStatusText();
      updateExpandSelectedButton();

      schedulePolling();
      fetchAndRender();
    })();
  </script>
</body>
</html>
